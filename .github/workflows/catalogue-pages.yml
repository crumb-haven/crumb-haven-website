name: Publish Catalogue to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/catalogue.pdf"
      - "catalogue-site/**"
      - ".github/workflows/catalogue-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "catalogue-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PDF.js
        run: |
          mkdir -p /tmp/pdfjs
          npm pack pdfjs-dist@3.11.174 --pack-destination /tmp/pdfjs
          tar -xzf /tmp/pdfjs/pdfjs-dist-3.11.174.tgz -C /tmp/pdfjs
          mkdir -p site
          cp catalogue-site/index.html site/index.html
          cp public/catalogue.pdf site/catalogue.pdf
          cp /tmp/pdfjs/package/build/pdf.min.js site/pdf.min.js
          cp /tmp/pdfjs/package/build/pdf.worker.min.js site/pdf.worker.min.js
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
