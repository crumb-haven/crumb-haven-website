<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crumb Haven Catalogue</title>
  <meta name="description" content="View the Crumb Haven B2B Cookie Catalogue.">
  <link rel="canonical" href="https://crumbhaven.in/catalogue">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f5f5f5;
    }
    body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #catalogue {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
    }
    .page {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 1px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #5b4636;
      font: 500 16px/1.5 Arial, sans-serif;
      text-align: center;
    }
    .error {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #7a1f1f;
      font: 500 16px/1.5 Arial, sans-serif;
      text-align: center;
    }
    @media (min-width: 1024px) {
      #catalogue { padding: 12px 0; }
      .page {
        width: min(100%, 1200px);
        margin-bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <main id="catalogue">
    <div id="loading" class="loading">Loading catalogue…</div>
  </main>

  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.worker.min.mjs";

    const container = document.getElementById("catalogue");
    const loading = document.getElementById("loading");

    async function renderCatalogue() {
      try {
        const pdf = await pdfjsLib.getDocument("/catalogue.pdf").promise;
        loading.remove();

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          const page = await pdf.getPage(pageNumber);

          const baseViewport = page.getViewport({ scale: 1 });
          const availableWidth = Math.min(
            window.innerWidth,
            window.innerWidth >= 1024 ? 1200 : window.innerWidth
          );

          const scale = availableWidth / baseViewport.width;
          const viewport = page.getViewport({ scale });

          const outputScale = Math.min(window.devicePixelRatio || 1, 2);
          const canvas = document.createElement("canvas");
          canvas.className = "page";
          canvas.setAttribute("aria-label", "Catalogue page " + pageNumber);

          canvas.width = Math.floor(viewport.width * outputScale);
          canvas.height = Math.floor(viewport.height * outputScale);
          canvas.style.width = Math.floor(viewport.width) + "px";
          canvas.style.height = Math.floor(viewport.height) + "px";

          const context = canvas.getContext("2d", { alpha: false });

          await page.render({
            canvasContext: context,
            viewport,
            transform: outputScale !== 1
              ? [outputScale, 0, 0, outputScale, 0, 0]
              : null
          }).promise;

          container.appendChild(canvas);
        }
      } catch (error) {
        console.error(error);
        loading.className = "error";
        loading.textContent = "The catalogue could not be displayed right now.";
      }
    }

    renderCatalogue();
  </script>
</body>
</html>
