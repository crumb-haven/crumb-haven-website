<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crumb Haven Catalogue</title>
  <meta name="description" content="View the Crumb Haven B2B Cookie Catalogue.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://crumbhaven.in/catalogue">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f4f4f4;
    }
    body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #catalogue {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .page-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      background: #fff;
      margin-bottom: 8px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }
    .status {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font: 16px/1.5 Arial, sans-serif;
      color: #5b4636;
    }
    @media (min-width: 1024px) {
      #catalogue {
        padding: 12px 0;
      }
      .page-wrap {
        width: min(100%, 1200px);
        margin-bottom: 12px;
      }
      canvas {
        width: 100% !important;
      }
    }
  </style>
</head>
<body>
  <main id="catalogue">
    <div id="status" class="status">Loading catalogue…</div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const root = document.getElementById("catalogue");
    const status = document.getElementById("status");

    async function renderCatalogue() {
      try {
        const pdf = await pdfjsLib.getDocument({
          url: "/catalogue.pdf",
          withCredentials: false
        }).promise;

        status.remove();

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          const page = await pdf.getPage(pageNumber);
          const base = page.getViewport({ scale: 1 });

          const containerWidth = Math.min(
            window.innerWidth,
            window.innerWidth >= 1024 ? 1200 : window.innerWidth
          );

          const cssScale = containerWidth / base.width;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const viewport = page.getViewport({ scale: cssScale * dpr });

          const wrap = document.createElement("div");
          wrap.className = "page-wrap";

          const canvas = document.createElement("canvas");
          canvas.width = Math.ceil(viewport.width);
          canvas.height = Math.ceil(viewport.height);
          canvas.style.width = Math.ceil(viewport.width / dpr) + "px";
          canvas.style.height = Math.ceil(viewport.height / dpr) + "px";

          const context = canvas.getContext("2d", { alpha: false });
          wrap.appendChild(canvas);
          root.appendChild(wrap);

          await page.render({
            canvasContext: context,
            viewport
          }).promise;
        }
      } catch (error) {
        console.error("Catalogue render failed:", error);
        status.textContent = "The catalogue could not be displayed right now.";
      }
    }

    renderCatalogue();
  </script>
</body>
</html>
