<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crumb Haven Catalogue</title>
    <meta
      name="description"
      content="View the Crumb Haven B2B Cookie Catalogue."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://crumbhaven.in/catalogue" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: #fff; }
      body { overflow: hidden; font-family: Arial, sans-serif; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
      .mobile-fallback {
        display: none;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
      }
      .mobile-fallback a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 16px 32px;
        border-radius: 10px;
        background: #783f04;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        box-shadow: 0 8px 24px rgba(0,0,0,.14);
      }
      @media (max-width: 1023px) {
        iframe { display: none; }
        .mobile-fallback { display: flex; }
      }
    </style>
  </head>
  <body>
    <iframe src="/catalogue.pdf" title="Crumb Haven Catalogue"></iframe>
    <div class="mobile-fallback">
      <a href="/catalogue.pdf">Open Catalogue</a>
    </div>
  </body>
</html>
